<!doctype html>
<html lang="he" dir="rtl" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#000000" />
		<!-- The mark, drawn by scripts/favicon.mjs in the Tanakh's own face. Browsers
		     keep icons apart from the page's cache: bump `v` whenever they are redrawn. -->
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png?v=2" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
		%sveltekit.head%
	</head>
	<body
		class="h-full overflow-hidden overscroll-none bg-black text-white antialiased caret-white selection:bg-white/30 selection:text-white"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
