[package]
name = "ethaor-server"
version = "0.1.0"
edition = "2024"

# The HTTP side: serves the static build and answers the API with the very
# code the WebAssembly modules run (`ethaor::shared`).
[dependencies]
ethaor = { path = ".." }
axum = "0.8"
dotenvy = "0.15"
futures-util = "0.3"
moka = { version = "0.12", features = ["future", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "catch-panic"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
