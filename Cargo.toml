[package]
name = "ethaor"
version = "0.1.0"
edition = "2024"

# Bibliotheque WebAssembly : tout le calcul vit ici, la page ne fait que peindre.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

# Le corpus est soude au binaire par build.rs. On vise la taille et la vitesse
# d'execution, pas la vitesse de compilation.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# build.rs parse 12 Mo de HTML : l'optimiser evite plusieurs secondes a chaque
# compilation propre.
[profile.dev.build-override]
opt-level = 2
[profile.release.build-override]
opt-level = 2
